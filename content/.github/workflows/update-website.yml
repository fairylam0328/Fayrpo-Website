name: Update Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fayrpo vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: fairylam0328/Fayrpo-Website
          ref: v5
          token: ${{ secrets.WEBSITE_PAT }}
          path: website

      - name: Sync vault into Quartz content
        run: |
          rm -rf website/content/*
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.obsidian/' \
            --exclude='.trash/' \
            --exclude='.gitignore' \
            vault/ website/content/

      - name: Commit and push website content
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content

          if git diff --cached --quiet; then
            echo "No website content changes."
            exit 0
          fi

          git commit -m "Sync content from Fayrpo"
          git push origin v5
